<!DOCTYPE HTML>
<html>
<head>
    <title>{{ title|default('Sha Tau Kok') }} - Hong Kong Control Point</title> <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/main.css') }}" />
    <noscript><link rel="stylesheet" href="{{ url_for('static', filename='assets/css/noscript.css') }}" /></noscript>

    <style>
        .info-card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            text-align: left;
            margin-top: 2em;
            border-top: 5px solid #283555; 
        }

        .info-card h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            font-size: 2.2em;
        }

        .details p {
            margin: 15px 0;
            font-size: 1.1em;
            color: #555;
            display: flex;
            align-items: center;
        }

        .details .icon {
            margin-right: 12px;
            font-size: 1.3em;
            color: #283555; 
            width: 25px;
            text-align: center;
        }

        .waiting-times {
            margin-top: 35px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }

        .waiting-times h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.6em;
        }

        .wait-group {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .wait-group h3 {
            color: #283555;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .wait-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .wait-group li {
            padding: 8px 0;
            font-size: 1.1em;
            border-bottom: 1px dashed #ddd;
        }
        .wait-group li:last-child {
            border-bottom: none;
        }

        .wait-group li strong {
            display: inline-block;
            width: 100px;
            color: #333;
            font-weight: 600;
        }
        

        .image.main {
            display: block;
            margin: 0 0 2em 0; 
            width: 100%;
            border-radius: 8px; 
            overflow: hidden; 
        }
        .image.main img {
            width: 100%;
            display: block;
        }

		.icon {
   			margin-right: 12px; 
		}	
		.address-text {
    		margin-left: 8px; 
		}

    </style>
</head>
<body class="is-preload">
    <div id="wrapper">

        <header id="header">
            <div class="inner">
                <a href="{{ url_for('home') }}" class="logo"> <span class="symbol">⬅</span><span class="title"> Back Home</span>
                </a>
                </div>
        </header>


        <div id="main">
            <div class="inner">
                
                <h1>Sha Tau Kok</h1>
                <span class="image main">
                    <img src="{{ url_for('static', filename='images/pic13.jpg') }}" alt="Sha Tau Kok" />
                </span>

                <div class="info-card">
                    <div class="details">
                        <p>
							<span class="icon">📍</span> 
							<strong>Location:</strong> 
							<span class="address-text">Sha Tau Kok Control Point, Sha Tau Kok, New Territories</span>
						</p>
                        <p>
							<span class="icon">🕒</span> 
							<strong>Opening Hours:</strong>  
							<span class="address-text">Clearance services have been suspended until further notice</span>
						</p>
                    </div>
                </div>
             </div>
        </div>

        <footer id="footer">
            <div class="inner"> <ul class="copyright">
                    <li>&copy; 2025 Mingyang Liu @ Hong Kong Project</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
                </ul>
            </div> </footer>

    </div>

    <script src="{{ url_for('static', filename='assets/js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/browser.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/breakpoints.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/util.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/main.js') }}"></script>

</body>
</html>
